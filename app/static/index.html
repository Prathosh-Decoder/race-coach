<!doctype html>
<html lang="en-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Coach</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231B2238'/%3E%3Ccircle cx='16' cy='20' r='7' fill='%23F0A43A'/%3E%3Crect x='4' y='20' width='24' height='8' fill='%231B2238'/%3E%3C/svg%3E">
</head>
<body>
<header class="sky" id="sky" data-phase="day">
  <div class="sky-sun" id="sun" aria-hidden="true"></div>
  <div class="sky-inner">
    <div class="sky-who">
      <button class="who" id="who" type="button" hidden></button>
      <p class="when" id="when" aria-live="off"></p>
    </div>
    <p class="countdown" id="countdown"></p>
  </div>
  <nav class="tabs" id="tabs" aria-label="Screens" hidden>
    <a href="#/today" data-tab="today">Today</a>
    <a href="#/week" data-tab="week">This week</a>
    <a href="#/calendar" data-tab="calendar">Calendar</a>
    <a href="#/coach" data-tab="coach">Tell the coach</a>
    <a href="#/review" data-tab="review" id="review-tab" hidden>Review changes <span class="count" id="review-count"></span></a>
    <a href="#/race" data-tab="race">Race</a>
    <a href="#/profile" data-tab="profile">Profile</a>
  </nav>
</header>

<main id="main" tabindex="-1"></main>

<p class="offline" id="offline" hidden>Coach offline. Your plan still works; changes wait until the coach is back.</p>

<script src="/static/js/knock.js"></script>
<script src="/static/js/extras.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
